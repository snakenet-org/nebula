# ==============================================================================
# @ai-purpose: Project metadata, build isolation, and strict dependency locking.
# @ai-dependency-policy:
#   - Do NOT upgrade major versions of `pydantic` or `fastapi` without explicit authorization.
#   - Keep python capability pinned to ^3.14.
#   - Always ask the user before adding a new dependency.
# @ai-tools: ruff (linting/formatting)
# ==============================================================================
#   Author: Marc Fiedler <marc@snakenet.org>
#   Date: 2026-09-18

[project]
name = "nebula"
version = "2.29.1"
description = "Nebula Vault, a self-hosted secrets manager for snakeNet.org"
readme = "README.md"
license = {text = "Apache Software License 2.0"}
requires-python = ">=3.14"

authors = [
    {name = "Marc Fiedler", email = "marc@snakenet.org"}
]
keywords = ["secrets-manager", "fastapi", "postgresql", "vault", "encryption"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.14"
]

dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.31.0",
    "bcrypt>=4.2.0",
    "cryptography>=44.0.0",
    "fastapi>=0.136.3",
    "fastmcp>=3.4.4",
    "loguru>=0.7.3",
    "pydantic>=2.0.0",
    "pyjwt>=2.12.1",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.50",
    "uvicorn>=0.47.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = []

[project.scripts]
nebula = "nebula:main"
