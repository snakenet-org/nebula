#       Nebula Vault: self-hosted secrets manager
#
# Build + push only, deliberately — unlike Satellite's own build.yml, this workflow does NOT run the
# snakenet-org/gravity-push (deploy notification) or snakenet-org/satellite-deploy (auto-deploy)
# steps, since Nebula Vault isn't registered anywhere yet with real secrets/push-topic-ids for
# those. Add them here, mirroring apps/satellite/.github/workflows/build.yml, once this app is
# actually deployed somewhere.

name: Build Pipeline for Nebula Vault
run-name: ${{ github.actor }} is building Nebula Vault 🌌
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  build-nebula:
    runs-on: ubuntu-latest
    environment: prod
    env:
      PUBLISHER: snakeNet
      MODULE: nebula
      NAME: Nebula Vault

      GITHUB_TOKEN: ${{ secrets.GIT_PAT }}
    steps:
        - name: Checking out code...
          uses: actions/checkout@v5
        - run: echo "${{ github.repository }} repository has been cloned to the runner."

        - name: Login to GitHub Container Registry
          uses: docker/login-action@v4
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - run: echo "Version ${{ github.ref_name }}-${{ github.sha }}"
        - run: echo "${{ github.ref_name }}" > ./VERSION
        - run: echo "${{ github.sha }}" > ./BUILD
        - run: echo `date` > ./BUILD_DATE

        - name: Build and push image multi arch
          uses: docker/build-push-action@v5
          with:
            context: .
            file: ./Dockerfile
            platforms: linux/amd64
            push: true
            tags: |
              ghcr.io/${{ github.actor }}/${{ env.MODULE }}:${{ github.ref_name }}
              ghcr.io/${{ github.actor }}/${{ env.MODULE }}:latest
            labels: |
              org.opencontainers.image.revision=${{ github.sha }}
              org.opencontainers.image.vendor=snakeNet.org
              org.opencontainers.image.url=https://snakeNet.org/
