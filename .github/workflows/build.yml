#       Nebula Vault: self-hosted secrets manager
#
# Build+push, then auto-deploy via Satellite — mirrors apps/satellite/.github/workflows/build.yml's
# own two-job shape (see that file's `deploy` job comment for the full reasoning on why this is a
# separate `needs: build-nebula` job rather than inline steps at the end of the build job: Satellite
# is the very service that PERFORMS every app's deploy trigger, so redeploying Nebula Vault from
# inside the still-running build job that produced its new image would mean that job asks the
# service it depends on to restart itself before the job has actually finished — a fresh `needs:`
# job only starts once build-nebula has fully completed and exited cleanly). Single image only
# (unlike Satellite, which also deploys its separate satellite-link reporter) — Nebula Vault has just
# the one Dockerfile/image. `snakenet-org/gravity-push` (the deploy push-notification step) is left
# out, same as before this job existed — no push_topic_id has been set up for this app yet.

name: Build Pipeline for Nebula Vault
run-name: ${{ github.actor }} is deploying Nebula Vault 🌌
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  build-nebula:
    runs-on: ubuntu-latest
    environment: Prod
    env:
      PUBLISHER: snakeNet
      MODULE: nebula
      NAME: Nebula Vault
    steps:
        - name: Checking out code...
          uses: actions/checkout@v5
        - run: echo "${{ github.repository }} repository has been cloned to the runner."

        - name: Login to GitHub Container Registry
          uses: docker/login-action@v4
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GH_PAT }}

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - run: echo "Version ${{ github.ref_name }}-${{ github.sha }}"
        - run: echo "${{ github.ref_name }}" > ./VERSION
        - run: echo "${{ github.sha }}" > ./BUILD
        - run: echo `date` > ./BUILD_DATE

        - name: Build and push image multi arch
          uses: docker/build-push-action@v5
          with:
            context: .
            file: ./Dockerfile
            platforms: linux/amd64
            push: true
            tags: |
              ghcr.io/${{ github.actor }}/${{ env.MODULE }}:${{ github.ref_name }}
              ghcr.io/${{ github.actor }}/${{ env.MODULE }}:latest
            labels: |
              org.opencontainers.image.revision=${{ github.sha }}
              org.opencontainers.image.vendor=snakeNet.org
              org.opencontainers.image.url=https://snakeNet.org/

  # See the header comment above for why this is its own job, gated on build-nebula's success,
  # rather than inline steps in that job.
  deploy:
    needs: build-nebula
    runs-on: ubuntu-latest
    environment: Prod
    steps:
        - run: echo "Deploying Nebula Vault ${{ github.ref_name }}"

        - name: Execute Satellite Deployment (nebula)
          id: satellite_deploy
          uses: snakenet-org/satellite-deploy@v1
          with:
            domain: 'ops.snakenet.io'
            satellite_token: ${{ secrets.SATELLITE_TOKEN }}
            deployment_token: ${{ secrets.DEPLOYMENT_TOKEN }}
            image: ghcr.io/${{ github.actor }}/nebula
            version: ${{ github.ref_name }}
