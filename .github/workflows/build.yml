#   (c) snakeNet.org, All rights reserved
#       Nebula Vault: self-hosted secrets manager
#
# Build+push, then auto-deploy via Satellite, then notify Pulsar — mirrors apps/gravity and
# apps/singularity's own three-job build.yml shape exactly (see gravity's `deploy` job comment for
# the full reasoning on why `deploy` is its own `needs: build-nebula` job rather than inline steps at
# the end of the build job: Satellite is the very service that PERFORMS every app's deploy trigger,
# so redeploying Nebula Vault from inside the still-running build job that produced its new image
# would mean that job asks the service it depends on to restart itself before the job has actually
# finished — a fresh `needs:` job only starts once build-nebula has fully completed and exited
# cleanly). Two images, built from the same source and versioned identically (see Dockerfile's own
# header): `nebula` (the default, lite — no embedded database, built from ./Dockerfile) and
# `nebula-aio` (all-in-one, embedded PostgreSQL 17, built from ./Dockerfile.aio) — each gets its own
# version tag plus its own `:latest` within its own image repo, so `nebula` being "the default" is
# about which image name a bare `nebula:latest` pull resolves to, not about `nebula-aio` lacking a
# floating tag of its own. `deploy` below still redeploys `nebula-aio` specifically —
# ops.snakenet.io's own existing Nebula Vault instance already runs on the embedded-Postgres image
# with its data volume in place, and switching that live deployment onto the lite image would mean
# pointing it at an external Postgres it doesn't have; the newly-added `nebula` image is for OTHER
# self-hosters who'd rather bring their own database, not a change to this app's own ops deployment.
#
# A `push` job (`needs: deploy`) sends a release notification via `snakenet-org/pulsar-push@v4` to
# apps/pulsar, the standalone VAPID web-push relay app — authenticated by a Pulsar Access Key + the
# shared X-Pulsar-Token secret. A separate `notify_build_failure` job (`needs: build-nebula`,
# `if: failure()`) sends the same kind of push notification when the `build-nebula` job itself fails,
# so a broken build/push-to-ghcr is surfaced the same way a successful deploy already is — it can't be
# folded into the `push` job since that one is gated on `deploy` succeeding, which never runs at all
# once `build-nebula` has failed. Nebula has no push_topic_id of its own minted in Pulsar yet, same as
# Singularity before it — deliberately reusing Gravity's own topic id
# (`7dc8bdea-d5d0-4ecb-ad28-14db3a4db413`, the same one Singularity already reuses) rather than
# leaving this out entirely or inventing a new one, so Nebula's build notifications land in the same
# place as Gravity's and Singularity's until/unless a dedicated topic is created for it later.
#
# 2026-09-22: added a second, independent trigger — `push: branches: [main]` — alongside the
# pre-existing tag trigger, since `origin` here is a personal fork (`marc-fiedler/nebula`), not the
# canonical org repo. `build-nebula`/`notify_build_failure`/`deploy`/`push` above are all still
# tag-only (`build-nebula` gained `if: startsWith(github.ref, 'refs/tags/')`; the other three key off
# `needs: build-nebula` alone — a `needs` job that was itself skipped, as `build-nebula` now is on an
# ordinary branch push, is treated as "not succeeded," so they skip automatically with no `if` change
# needed on any of them). Two NEW jobs run only `if: github.ref == 'refs/heads/main'`, independently
# of each other and of the tag-triggered jobs above: `mirror-main` (git-pushes the exact merged commit
# to `main` on the canonical `git@github.com:snakenet-org/nebula.git`, over HTTPS using `GH_PAT` — the
# same token already used to log into ghcr.io as `github.actor`, confirmed with the user to already
# carry push rights there too, so no separate mirror-specific credential was introduced) and
# `push-dockerhub-latest` (rebuilds both the lite and all-in-one images and pushes ONLY a `:latest` tag
# for each — `docker.io/snakenet-org/nebula`/`docker.io/snakenet-org/nebula-aio` — no versioned tag,
# since an ordinary merge-to-main commit has no release version associated with it; that still only
# happens via the tag-triggered `build-nebula` job above, which pushes to ghcr.io, not Docker Hub).
# Docker Hub login uses `secrets.DOCKER_ACCESS_KEY` as the password against username `snakenet-org`
# (confirmed with the user — this repo's Docker Hub org/username, not a per-developer account).

# 2026-11-08: every real job is now gated on `github.repository == 'marc-fiedler/nebula'`. This same
# workflow file lands in the canonical `snakenet-org/nebula` repo too (via `mirror-main` below), where
# none of the required secrets/environments exist, so it always failed there. On any repo other than
# the fork, every real job is skipped (`deploy`/`push` skip automatically via `needs: build-nebula`)
# and only the trivial `noop` job runs, so the snakenet-org run reports a clean success instead.

name: Build Pipeline for Nebula Vault
run-name: ${{ github.actor }} is deploying Nebula Vault 🌌
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+"
    branches:
      - main

jobs:
  # Runs ONLY outside the fork (e.g. snakenet-org/nebula) so that workflow run succeeds by default
  # instead of failing on missing secrets — see the 2026-11-08 header note above.
  noop:
    if: github.repository != 'marc-fiedler/nebula'
    runs-on: ubuntu-latest
    steps:
        - run: echo "Build pipeline only runs on marc-fiedler/nebula — nothing to do on ${{ github.repository }}."

  build-nebula:
    if: github.repository == 'marc-fiedler/nebula' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: prod
    env:
      PUBLISHER: snakeNet
      MODULE: nebula
      NAME: Nebula Vault
    steps:
        - name: Checking out code...
          uses: actions/checkout@v5
        - run: echo "${{ github.repository }} repository has been cloned to the runner."

        - name: Login to GitHub Container Registry
          uses: docker/login-action@v4
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GH_PAT }}

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - run: echo "Version ${{ github.ref_name }}-${{ github.sha }}"
        - run: echo "${{ github.ref_name }}" > ./VERSION
        - run: echo "${{ github.sha }}" > ./BUILD
        - run: echo `date` > ./BUILD_DATE

        - name: Build and push Lite image (default, nebula)
          uses: docker/build-push-action@v5
          with:
            context: .
            file: ./Dockerfile
            platforms: linux/amd64
            push: true
            tags: |
              ghcr.io/${{ github.actor }}/${{ env.MODULE }}:${{ github.ref_name }}
              ghcr.io/${{ github.actor }}/${{ env.MODULE }}:latest
            labels: |
              org.opencontainers.image.title=${{ env.MODULE }}
              org.opencontainers.image.description=Self-hosted secrets manager for snakeNet.org (lite — bring your own PostgreSQL)
              org.opencontainers.image.revision=${{ github.sha }}
              org.opencontainers.image.vendor=snakeNet.org
              org.opencontainers.image.url=https://snakeNet.org/

        - name: Build and push All-in-One image (nebula-aio)
          uses: docker/build-push-action@v5
          with:
            context: .
            file: ./Dockerfile.aio
            platforms: linux/amd64
            push: true
            tags: |
              ghcr.io/${{ github.actor }}/${{ env.MODULE }}-aio:${{ github.ref_name }}
              ghcr.io/${{ github.actor }}/${{ env.MODULE }}-aio:latest
            labels: |
              org.opencontainers.image.title=${{ env.MODULE }}-aio
              org.opencontainers.image.description=Self-hosted secrets manager for snakeNet.org (all-in-one — embedded PostgreSQL)
              org.opencontainers.image.revision=${{ github.sha }}
              org.opencontainers.image.vendor=snakeNet.org
              org.opencontainers.image.url=https://snakeNet.org/

  # See the header comment above for why this is its own job, gated on build-nebula having failed,
  # rather than a failure-handling step inside the build job itself.
  notify_build_failure:
    needs: build-nebula
    if: failure() && github.repository == 'marc-fiedler/nebula'
    runs-on: ubuntu-latest
    environment: prod
    steps:
        - name: Send Build Failure Notification to Pulsar
          id: pulsar_push_failure
          uses: snakenet-org/pulsar-push@v4
          with:
            push_service_url: ${{ vars.PULSAR_PUSH_URL }}
            push_service_access_key: ${{ secrets.PULSAR_PUSH_API_KEY }}
            push_service_token: ${{ secrets.PULSAR_PUSH_TOKEN }}
            push_topic_id: '7dc8bdea-d5d0-4ecb-ad28-14db3a4db413'
            push_message_title: 'Nebula Vault ${{ github.ref_name }} build failed!'
            push_message_body: '${{ github.actor }}''s build for Nebula Vault ${{ github.ref_name }} failed.'
            push_message_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'

  # See the header comment above for why this is its own job, gated on build-nebula's success,
  # rather than inline steps in that job.
  deploy:
    needs: build-nebula
    runs-on: ubuntu-latest
    environment: prod
    steps:
        - run: echo "Deploying Nebula Vault ${{ github.ref_name }}"

        - name: Execute Satellite Deployment (nebula)
          id: satellite_deploy
          uses: snakenet-org/satellite-deploy@v1
          with:
            domain: 'ops.snakenet.io'
            satellite_token: ${{ secrets.SATELLITE_TOKEN }}
            deployment_token: ${{ secrets.DEPLOYMENT_TOKEN }}
            image: ghcr.io/${{ github.actor }}/nebula-aio
            version: ${{ github.ref_name }}

  # See the header comment above for why this is its own job, gated on deploy's success, rather than
  # inline steps in that job.
  push:
    needs: deploy
    runs-on: ubuntu-latest
    environment: prod
    steps:
        - name: Send Push Notification to Pulsar
          id: pulsar_push
          uses: snakenet-org/pulsar-push@v4
          with:
            push_service_url: ${{ vars.PULSAR_PUSH_URL }}
            push_service_access_key: ${{ secrets.PULSAR_PUSH_API_KEY }}
            push_service_token: ${{ secrets.PULSAR_PUSH_TOKEN }}
            push_topic_id: '7dc8bdea-d5d0-4ecb-ad28-14db3a4db413'
            push_message_title: 'Nebula Vault ${{ github.ref_name }} deployed!'
            push_message_body: '${{ github.actor }} just deployed Nebula Vault v${{ github.ref_name }}.'
            push_message_url: 'https://snakenet.org/'

  # See the header comment above (2026-09-22 note) for why this only runs on a plain push to main,
  # independently of the tag-triggered jobs above — mirrors the exact merged commit onto the
  # canonical org repo, which `origin` here (a personal fork) is not.
  mirror-main:
    if: github.repository == 'marc-fiedler/nebula' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
        - name: Checking out code...
          uses: actions/checkout@v5
          with:
            fetch-depth: 0
            # actions/checkout persists the ephemeral GITHUB_TOKEN as a git credential
            # (http.https://github.com/.extraheader) by default, and that persisted header takes
            # precedence over the token embedded in the push URL below — so without this, the push
            # silently authenticates as github-actions[bot] (which has no access to
            # snakenet-org/nebula) instead of GH_PAT, and fails with a 403. Confirmed via a real
            # failed run before this fix.
            persist-credentials: false

        - name: Push main to git@github.com:snakenet-org/nebula.git
          run: |
            git push "https://x-access-token:${{ secrets.GH_PAT }}@github.com/snakenet-org/nebula.git" "${{ github.sha }}:refs/heads/main"

  # See the header comment above (2026-09-22 note) for why this only runs on a plain push to main,
  # pushing `:latest` only (no version tag exists for an ordinary merge commit) to Docker Hub,
  # independently of build-nebula's own tag-triggered, ghcr.io-only release build above. Docker Hub's
  # own namespace is `snakenet` (no `-org` suffix — confirmed directly from Docker Hub's own "docker
  # login -u snakenet" instructions for the DOCKER_ACCESS_KEY token after the first version of this
  # job, using `snakenet-org` here to match the GitHub org name, failed login with 401 unauthorized;
  # Docker Hub's namespace is unrelated to and doesn't have to match the GitHub org name).
  push-dockerhub-latest:
    if: github.repository == 'marc-fiedler/nebula' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
        - name: Checking out code...
          uses: actions/checkout@v5

        - name: Login to Docker Hub
          uses: docker/login-action@v4
          with:
            username: snakenet
            password: ${{ secrets.DOCKER_ACCESS_KEY }}

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Build and push Lite image (default, nebula)
          uses: docker/build-push-action@v5
          with:
            context: .
            file: ./Dockerfile
            platforms: linux/amd64
            push: true
            tags: docker.io/snakenet/nebula:latest
            labels: |
              org.opencontainers.image.title=nebula
              org.opencontainers.image.description=Self-hosted secrets manager for snakeNet.org (lite — bring your own PostgreSQL)
              org.opencontainers.image.revision=${{ github.sha }}
              org.opencontainers.image.vendor=snakeNet.org
              org.opencontainers.image.url=https://snakeNet.org/

        - name: Build and push All-in-One image (nebula-aio)
          uses: docker/build-push-action@v5
          with:
            context: .
            file: ./Dockerfile.aio
            platforms: linux/amd64
            push: true
            tags: docker.io/snakenet/nebula-aio:latest
            labels: |
              org.opencontainers.image.title=nebula-aio
              org.opencontainers.image.description=Self-hosted secrets manager for snakeNet.org (all-in-one — embedded PostgreSQL)
              org.opencontainers.image.revision=${{ github.sha }}
              org.opencontainers.image.vendor=snakeNet.org
              org.opencontainers.image.url=https://snakeNet.org/
